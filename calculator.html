  .no-underline {
    text-decoration-line: none;
  }
  .underline {
    text-decoration-line: underline;
  }
  .underline-offset-4 {
    text-underline-offset: 4px;
  }
  .antialiased {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .transition-colors {
    transition-property: color, background-color, border-color, outline-color, text-decoration-color, fill, stroke, --tw-gradient-from, --tw-gradient-via, --tw-gradient-to;
    transition-timing-function: var(--tw-ease, var(--default-transition-timing-function));
    transition-duration: var(--tw-duration, var(--default-transition-duration));
  }
  .transition-opacity {
    transition-property: opacity;
    transition-timing-function: var(--tw-ease, var(--default-transition-timing-function));
    transition-duration: var(--tw-duration, var(--default-transition-duration));
  }
  .transition-transform {
    transition-property: transform, translate, scale, rotate;
    transition-timing-function: var(--tw-ease, var(--default-transition-timing-function));
    transition-duration: var(--tw-duration, var(--default-transition-duration));
  }
  .placeholder\:text-muted\/60::placeholder {
    color: var(--lh-muted);
    @supports (color: color-mix(in lab, red, red)) {
      color: color-mix(in oklab, var(--lh-muted) 60%, transparent);
    }
  }
  .focus-within\:border-line-strong:focus-within {
    border-color: var(--lh-line-strong);
  }
  @media (hover: hover) {
    .hover\:border-inverse-fg:hover {
      border-color: var(--lh-inverse-fg);
    }
    .hover\:bg-surface-2:hover {
      background-color: var(--lh-surface-2);
    }
    .hover\:opacity-85:hover {
      opacity: 85%;
    }
    .hover\:opacity-90:hover {
      opacity: 90%;
    }
  }
  .focus\:not-sr-only:focus {
    position: static;
    width: auto;
    height: auto;
    padding: 0;
    margin: 0;
    overflow: visible;
    clip-path: none;
    white-space: normal;
  }
  .focus\:absolute:focus {
    position: absolute;
  }
  .focus\:top-4:focus {
    top: calc(var(--spacing) * 4);
  }
  .focus\:left-4:focus {
    left: calc(var(--spacing) * 4);
  }
  .focus\:z-50:focus {
    z-index: 50;
  }
  .focus\:border-line-strong:focus {
    border-color: var(--lh-line-strong);
  }
  .focus\:bg-fg:focus {
    background-color: var(--lh-fg);
  }
  .focus\:px-3:focus {
    padding-inline: calc(var(--spacing) * 3);
  }
  .focus\:py-2:focus {
    padding-block: calc(var(--spacing) * 2);
  }
  .focus\:text-bg:focus {
    color: var(--lh-bg);
  }
  .focus\:outline-none:focus {
    --tw-outline-style: none;
    outline-style: none;
  }
  @media (width >= 40rem) {
    .sm\:w-56 {
      width: calc(var(--spacing) * 56);
    }
    .sm\:grid-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .sm\:grid-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .sm\:grid-cols-\[5rem_1fr\] {
      grid-template-columns: 5rem 1fr;
    }
    .sm\:grid-cols-\[10rem_1fr_7rem\] {
      grid-template-columns: 10rem 1fr 7rem;
    }
    .sm\:flex-row {
      flex-direction: row;
    }
    .sm\:items-center {
      align-items: center;
    }
    .sm\:justify-between {
      justify-content: space-between;
    }
    .sm\:gap-4 {
      gap: calc(var(--spacing) * 4);
    }
    .sm\:border-t-0 {
      border-top-style: var(--tw-border-style);
      border-top-width: 0px;
    }
    .sm\:border-l {
      border-left-style: var(--tw-border-style);
      border-left-width: 1px;
    }
    .sm\:p-6 {
      padding: calc(var(--spacing) * 6);
    }
    .sm\:px-8 {
      padding-inline: calc(var(--spacing) * 8);
    }
    .sm\:py-5 {
      padding-block: calc(var(--spacing) * 5);
    }
    .sm\:pt-16 {
      padding-top: calc(var(--spacing) * 16);
    }
    .sm\:text-right {
      text-align: right;
    }
    .sm\:text-3xl {
      font-size: var(--text-3xl);
      line-height: var(--tw-leading, var(--text-3xl--line-height));
    }
    .sm\:text-4xl {
      font-size: var(--text-4xl);
      line-height: var(--tw-leading, var(--text-4xl--line-height));
    }
    .sm\:text-lg {
      font-size: var(--text-lg);
      line-height: var(--tw-leading, var(--text-lg--line-height));
    }
    .sm\:text-\[2\.4rem\] {
      font-size: 2.4rem;
    }
  }
  @media (width >= 48rem) {
    .md\:grid-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .md\:grid-cols-\[1fr_auto\] {
      grid-template-columns: 1fr auto;
    }
    .md\:items-end {
      align-items: flex-end;
    }
  }
  @media (width >= 64rem) {
    .lg\:w-auto {
      width: auto;
    }
    .lg\:grid-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .lg\:grid-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .lg\:grid-cols-\[1\.1fr_1fr\] {
      grid-template-columns: 1.1fr 1fr;
    }
    .lg\:grid-cols-\[1\.35fr_1\.15fr_0\.9fr_1fr\] {
      grid-template-columns: 1.35fr 1.15fr 0.9fr 1fr;
    }
    .lg\:flex-row {
      flex-direction: row;
    }
    .lg\:items-end {
      align-items: flex-end;
    }
    .lg\:justify-between {
      justify-content: space-between;
    }
  }
}
:root {

  --lh-surface: #f8f6f1;

  --lh-muted: #5d5950;

  --lh-inverse-bg: #0e0e0e;

}

    --lh-line-strong: #f2efe8;
    --lh-accent: #ff5b1f;
    --lh-accent-text: #ff7a45;
    --lh-on-accent: #0e0e0e;
    --lh-inverse-bg: #f2efe8;
    --lh-inverse-fg: #0e0e0e;

  }
}

html {
  background: var(--lh-bg);
  color: var(--lh-fg);
  -webkit-text-size-adjust: 100%;
}
body {
  font-family: var(--font-sans);
  font-feature-settings: "tnum" 0;
}
.tnum {
  font-variant-numeric: tabular-nums;
}
:where(a, button, input, select, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--lh-focus);
  outline-offset: 2px;
}
.kicker {
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--lh-accent-text);
}
.kicker-rule::before {
  content: "";
  display: inline-block;
  width: 1.5rem;
  height: 2px;
  margin-right: 0.6rem;
  vertical-align: 0.22em;
  background: currentColor;
}
input[inputmode] {
  -moz-appearance: textfield;
}
@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}
@property --tw-border-style {
  syntax: "*";
  inherits: false;
  initial-value: solid;
}
@property --tw-leading {
  syntax: "*";
  inherits: false;
}
@property --tw-font-weight {
  syntax: "*";
  inherits: false;
}
@property --tw-tracking {
  syntax: "*";
  inherits: false;
}
@layer properties {
  @supports ((-webkit-hyphens: none) and (not (margin-trim: inline))) or ((-moz-orient: inline) and (not (color:rgb(from red r g b)))) {
    *, ::before, ::after, ::backdrop {
      --tw-border-style: solid;
      --tw-leading: initial;
      --tw-font-weight: initial;
      --tw-tracking: initial;
    }
  }
}
</style>
